# Untrusted CI for a PUBLIC repo.
#
# This workflow runs on pull requests, including from forks, so it must hold
# nothing of value: no secrets, no cloud identity, no self-hosted runners.
# Signed builds and deployment live in the private repo eka-care/release-pipelines.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            external/ekascribe/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint:tslint
