name: Build & Release

on:
  push:
    # branches: [main]
    tags: ['prod-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# ── Fill in your non-secret app env vars here ─────────────────────────────────
env:
  S3_BUCKET: vaarta-app
  BASE_URL: https://vaarta-app.ekacare.co
  NEXT_PUBLIC_ENV: PROD
  ELECTRON_ENV: |
    EKA_API_UPSTREAM=https://vaarta.bharatai.gov.in
    NEXT_PUBLIC_ENV=PROD

jobs:
  # ─── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            external/ekascribe/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Only needed for release builds
      - name: Install AzureSignTool
        if: startsWith(github.ref, 'refs/tags/prod-')
        run: dotnet tool install --global AzureSignTool

      - run: npm ci

      - name: Write electron.env
        shell: bash
        run: |
          echo "$ELECTRON_ENV" > electron.env

      # Runs prepackage hook (builds win-helper + ekascribe-web) + vite build
      - name: Package
        run: npm run package

      # Publish x64 + arm64 helpers (needed by electron-builder extraResources)
      - name: Build Windows helpers (x64 + arm64)
        if: startsWith(github.ref, 'refs/tags/prod-')
        run: npm run build:win-helper:all

      - name: Build NSIS installers
        if: startsWith(github.ref, 'refs/tags/prod-')
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          npx electron-builder --win nsis --x64 --arm64 --publish never
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload Windows artifacts
        if: startsWith(github.ref, 'refs/tags/prod-')
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 1

  # ─── macOS ────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-26  # arm64 (M-series)
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            external/ekascribe/package-lock.json

      - run: npm ci

      - name: Write electron.env
        run: |
          echo "$ELECTRON_ENV" > electron.env

      # Build helper without signing — electron-builder deep-signs the whole bundle later
      - name: Build macOS helper
        if: startsWith(github.ref, 'refs/tags/prod-')
        run: |
          xcodebuild \
            -project mac/EkaCareDesktopHelper/EkaCareDesktopHelper.xcodeproj \
            -scheme EkaCareDesktopHelper \
            -configuration Release \
            build -quiet \
            SYMROOT="$PWD/mac/build" \
            CONFIGURATION_BUILD_DIR="$PWD/mac/build/Release" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Runs prepackage hook (builds ekascribe-web) + vite build
      - name: Package
        run: npm run package

      - name: Build macOS installers
        if: startsWith(github.ref, 'refs/tags/prod-')
        run: npx electron-builder --mac dmg zip --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        if: startsWith(github.ref, 'refs/tags/prod-')
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          retention-days: 1

  # ─── GitHub Release ───────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/prod-')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  # ─── Deploy to S3 ────────────────────────────────────────────────────────
  deploy:
    if: startsWith(github.ref, 'refs/tags/prod-')
    needs: [build-windows, build-mac]
    runs-on: [prod-ec2-server]
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: dist/

      - name: Sync to S3
        run: |
          VERSION=${GITHUB_REF_NAME#prod-}

          # Versioned archive — organized by platform/arch
          aws s3 sync dist/ s3://$S3_BUCKET/prod/${VERSION}/windows/x64/ \
            --exclude "*" \
            --include "*.exe" --include "*.exe.blockmap" \
            --exclude "*arm64*"

          aws s3 sync dist/ s3://$S3_BUCKET/prod/${VERSION}/windows/arm64/ \
            --exclude "*" \
            --include "*arm64*.exe" --include "*arm64*.exe.blockmap"

          aws s3 sync dist/ s3://$S3_BUCKET/prod/${VERSION}/mac/arm64/ \
            --exclude "*" \
            --include "*.dmg" --include "*.dmg.blockmap" \
            --include "*.zip" --include "*.zip.blockmap"

          aws s3 cp dist/latest.yml     s3://$S3_BUCKET/prod/${VERSION}/
          aws s3 cp dist/latest-mac.yml s3://$S3_BUCKET/prod/${VERSION}/

          # latest/ stays flat — auto-updater resolves binary paths relative to latest.yml
          aws s3 sync dist/ s3://$S3_BUCKET/prod/latest/ --delete

      - name: Print download URLs
        run: |
          VERSION=${GITHUB_REF_NAME#prod-}
          BASE=$BASE_URL/prod
          {
            echo "## Vaarta ${VERSION} — Download URLs"
            echo ""
            echo "### Versioned \`${VERSION}\`"
            echo "| Platform | Arch | Link |"
            echo "| --- | --- | --- |"
            echo "| Windows | x64 | [Vaarta Setup.exe](${BASE}/${VERSION}/windows/x64/Vaarta%20Setup.exe) |"
            echo "| Windows | arm64 | [Vaarta Setup-arm64.exe](${BASE}/${VERSION}/windows/arm64/Vaarta%20Setup-arm64.exe) |"
            echo "| macOS | arm64 | [Vaarta.dmg](${BASE}/${VERSION}/mac/arm64/Vaarta.dmg) |"
            echo "| macOS | arm64 (zip) | [Vaarta.zip](${BASE}/${VERSION}/mac/arm64/Vaarta.zip) |"
            echo ""
            echo "### Latest"
            echo "| Platform | Arch | Link |"
            echo "| --- | --- | --- |"
            echo "| Windows | x64 | [Vaarta Setup.exe](${BASE}/latest/Vaarta%20Setup.exe) |"
            echo "| Windows | arm64 | [Vaarta Setup-arm64.exe](${BASE}/latest/Vaarta%20Setup-arm64.exe) |"
            echo "| macOS | arm64 | [Vaarta.dmg](${BASE}/latest/Vaarta.dmg) |"
            echo "| macOS | arm64 (zip) | [Vaarta.zip](${BASE}/latest/Vaarta.zip) |"
          } >> "$GITHUB_STEP_SUMMARY"
